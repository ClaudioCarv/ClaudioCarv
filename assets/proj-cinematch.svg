<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320" role="img" aria-label="CineMatch" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1017"/><stop offset="1" stop-color="#14283a"/></linearGradient>
  <filter id="g" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .flow{stroke-dasharray:14 12;animation:flow 3s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-104}}
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .float{animation:fl 4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .spin{animation:sp 18s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cta{animation:cta 2.4s ease-in-out infinite}
  @keyframes cta{0%,100%{opacity:.7}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="2" y="2" width="576" height="316" rx="24" fill="url(#bg)"/>
<rect x="2" y="2" width="576" height="316" rx="24" fill="none" stroke="#C9A227" stroke-opacity=".3" stroke-width="2"/>
<rect class="flow" x="2" y="2" width="576" height="316" rx="24" fill="none" stroke="#C9A227" stroke-width="2.5" filter="url(#g)"/>
<circle class="tw" cx="300" cy="40" r="1.6" fill="#fff"/><circle class="tw" cx="360" cy="70" r="1.2" fill="#fff" style="animation-delay:-1s"/><circle class="tw" cx="420" cy="30" r="1.4" fill="#fff" style="animation-delay:-2s"/><circle class="tw" cx="545" cy="205" r="1.2" fill="#fff" style="animation-delay:-.5s"/>
<rect x="36" y="38" width="9" height="9" fill="#FFB347" transform="rotate(45 40.5 42.5)" filter="url(#g)"/>
<text x="56" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#FFB347">Artefato em destaque</text>
<g class="float" transform="translate(500 80)"><g class="spin"><circle r="30" fill="none" stroke="#7FB7D6" stroke-width="3.5"/><circle r="5" fill="#7FB7D6"/>
<circle cx="0" cy="-16" r="6" fill="none" stroke="#7FB7D6" stroke-width="2.5"/><circle cx="15" cy="-5" r="6" fill="none" stroke="#7FB7D6" stroke-width="2.5"/><circle cx="9" cy="13" r="6" fill="none" stroke="#7FB7D6" stroke-width="2.5"/><circle cx="-9" cy="13" r="6" fill="none" stroke="#7FB7D6" stroke-width="2.5"/><circle cx="-15" cy="-5" r="6" fill="none" stroke="#7FB7D6" stroke-width="2.5"/></g></g>
<text x="36" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#C9A227" filter="url(#g)">CineMatch</text>
<text x="36" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#E8DFC8">Digite o nome de um filme e receba recomendações</text><text x="36" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#E8DFC8">de filmes com gênero parecido. Feito com TF-IDF,</text><text x="36" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#E8DFC8">similaridade de cosseno e interface em Streamlit.</text>
<rect x="36" y="238" width="80" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity=".8"/><text x="76.0" y="257" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C9A227">Python</text><rect x="126" y="238" width="80" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity=".8"/><text x="166.0" y="257" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C9A227">TF-IDF</text><rect x="216" y="238" width="89" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity=".8"/><text x="260.5" y="257" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C9A227">Cosseno</text><rect x="315" y="238" width="107" height="28" rx="14" fill="none" stroke="#C9A227" stroke-opacity=".8"/><text x="368.5" y="257" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C9A227">Streamlit</text>
<text class="cta" x="544" y="298" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7FB7D6">Abrir no GitHub  ›</text>
